# cargo-audit configuration.
#
# `cargo audit --deny warnings` (run in CI) treats unmaintained / unsound
# advisories as hard failures. Override per-RUSTSEC with a written
# justification so the auditor sees both that we know about the issue and
# why we accept it.

[advisories]
# No active ignores. RUSTSEC-2026-0097 (rand 0.8 unsoundness) was RESOLVED, not
# ignored: rand was bumped 0.8.5 → 0.8.6, the advisory's own backported patch
# fix (`Solution: Upgrade to ... >=0.8.6`). `cargo deny check advisories`
# reports clean with no ignore entry.
ignore = []
