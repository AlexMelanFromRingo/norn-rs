[package]
name = "norn-rs"
version = "0.4.0"
edition = "2024"
description = "Next-generation mesh routing protocol — hyperbolic routing, K=3 spanning trees, ChaCha20-Poly1305 sessions"
license = "MIT"

[[bin]]
name = "nornd"
path = "src/bin/nornd.rs"

[[bin]]
name = "nornctl"
path = "src/bin/nornctl.rs"

[features]
default = ["tun-support"]
tun-support = ["dep:tun2"]

[dependencies]
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["reusable_secrets", "static_secrets"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
rand = "0.8"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
curve25519-dalek = "4"
sha2 = "0.10"
toml = "0.8"
socket2 = { version = "0.5", features = ["all"] }
tun2 = { version = "3", features = ["async"], optional = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
mutants = "0.0.3"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
ml-kem = { version = "0.3", features = ["zeroize", "getrandom"] }
hkdf = "0.12"
subtle = "2"
mdns-sd = { version = "0.19", default-features = false, features = ["async"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "bench"
harness = false

# Speed up tests: ML-KEM-768 ops are ~100× faster at opt-level=2 vs 0.
# Without this the parallel integration test suite serialises on the
# crypto operations and times out under contention.
[profile.test]
opt-level = 2

[profile.dev]
# Match — keeps `cargo run` of nornd usable for manual testing.
opt-level = 2
