[package]
name = "norn-rs"
version = "0.12.2"
edition = "2024"
description = "Next-generation mesh routing protocol — hyperbolic routing, K=3 spanning trees, ChaCha20-Poly1305 sessions"
license = "MIT"

[[bin]]
name = "nornd"
path = "src/bin/nornd.rs"

[[bin]]
name = "nornctl"
path = "src/bin/nornctl.rs"

[features]
default = ["tun-support"]
tun-support = ["dep:tun2"]
# Opt-in fixed-size (Sphinx-style) onion routing + capability negotiation.
# OFF by default: the default build keeps the original protocol behaviour
# (no CapabilityAnnounce flooding, no Sphinx cell construction/selection) and
# does NOT pull the chacha20 dep — it's enabled only with this feature.
sphinx = ["dep:chacha20"]

[dependencies]
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["reusable_secrets", "static_secrets"] }
chacha20poly1305 = "0.10"
# Raw ChaCha20 keystream PRG for the Sphinx-style onion header/payload (src/sphinx.rs).
# Optional: only pulled in by the `sphinx` feature, so the default build's
# dependency graph is unchanged from the original. Same version chacha20poly1305
# already uses transitively.
chacha20 = { version = "0.9", optional = true }
blake2 = "0.10"
rand = "0.8"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
curve25519-dalek = "4"
sha2 = "0.10"
toml = "0.8"
socket2 = { version = "0.5", features = ["all"] }
tun2 = { version = "3", features = ["async"], optional = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
mutants = "0.0.3"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
ml-kem = { version = "0.3", features = ["zeroize", "getrandom"] }
# PQ-hybrid signatures (Option B: ML-DSA-65 alongside Ed25519 on the handshake,
# TOFU-pinned per identity). Independent of the Ed25519 key on purpose.
ml-dsa = { version = "0.1", features = ["rand_core"] }
hkdf = "0.12"
subtle = "2"
mdns-sd = { version = "0.19", default-features = false, features = ["async"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# Roadmap #8: human-friendly key sharing — BIP39 word mnemonics + QR codes.
bip39 = "2"
qrcode = { version = "0.14", default-features = false }

# Linux-only: SO_TCP_INFO ground-truth RTT/loss reader in src/tcp_info.rs.
# Bypasses application-layer probe contamination from TCP HoL blocking.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "bench"
harness = false

# Speed up tests: ML-KEM-768 ops are ~100× faster at opt-level=2 vs 0.
# Without this the parallel integration test suite serialises on the
# crypto operations and times out under contention.
[profile.test]
opt-level = 2

[profile.dev]
# Match — keeps `cargo run` of nornd usable for manual testing.
opt-level = 2
